<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-box">

        <h1>Welcome Back!</h1>
        <p>Login to continue</p>

        <form id="loginForm">

            <label for="contact">Email Address / Mobile Phone</label>
            <input
                type="text"
                id="contact"
                placeholder="Enter email or mobile number"
            >

            <label for="password">Password</label>

            <div class="password-box">
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                >
                <button type="button" id="showPassword">Show</button>
            </div>

            <div class="forgot">
                <a href="forgot-password.html">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">Log In</button>

            <p id="message"></p>

        </form>

        <div class="divider">
            <span>OR</span>
        </div>

        <!-- Google Login -->
        <button type="button" class="social-btn google" onclick="googleLogin()">
        <span class="google-icon">G</span>
        Continue with Google
        </button>

        <!-- Apple Login -->
        <button type="button" class="social-btn apple" onclick="appleLogin()">
        <span class="apple-icon">A</span>
        Continue with Apple
        </button>

        <div class="signup">
            Don't have an account?
            <a href="../signup/signup.html">Sign Up</a>
        </div>

    </div>

    <script src="login.js"></script>

</body>
</html>
