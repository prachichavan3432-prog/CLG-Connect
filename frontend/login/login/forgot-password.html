<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | CLG Connect</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <main class="login-box">
        <h1>Reset Password</h1>
        <p>We’ll email a one-time verification code to your account.</p>

        <form id="requestCodeForm">
            <label for="email">Account email</label>
            <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
            <button class="login-btn" type="submit" id="sendCodeButton">Send verification code</button>
        </form>

        <form id="resetPasswordForm" hidden>
            <p>Enter the 6-digit code sent to <strong id="resetEmail"></strong>.</p>
            <label for="otp">Verification code</label>
            <input id="otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required placeholder="6-digit code">

            <label for="newPassword">New password</label>
            <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters">

            <label for="confirmPassword">Confirm new password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Enter the password again">

            <button class="login-btn" type="submit" id="resetPasswordButton">Change password</button>
            <div class="forgot"><a href="#" id="resendCode">Send another code</a></div>
        </form>

        <p id="message" role="status" aria-live="polite"></p>
        <div class="signup"><a href="login.html">Back to Log In</a></div>
    </main>
    <script src="forgot-password.js"></script>
</body>
</html>
