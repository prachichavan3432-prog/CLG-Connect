<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>

    <div class="signup-box">
        <h1>Create Account</h1>
        <p>Sign up to get started</p>

        <form id="signupForm">

            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="contact">Email Address / Mobile Phone</label>
            <input type="text" id="contact" placeholder="Enter email or mobile number" required>

            <label for="password">Password</label>
            <div class="password-box">
                <input type="password" id="password" placeholder="Create a password" required minlength="6">
                <button type="button" id="showPassword">Show</button>
            </div>

            <button type="submit" class="signup-btn">Sign Up</button>

            <p id="message"></p>

        </form>

        <p class="login-text">
            Already have an account?
                <a href="../login/login.html">Log In</a>
        </p>
    </div>

    <script src="signup.js"></script>
</body>
</html>
