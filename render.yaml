services:
  - type: web
    name: clg-connect-prachichavan3432
    runtime: node
    plan: free
    region: singapore
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: clg-connect-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

